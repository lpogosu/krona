<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="КРОНА показывает расписания cron на кроне суточного дерева: пересечения задач, пики нагрузки и ловушки часовых поясов." />
    <link rel="icon" type="image/webp" href="./art/logo.webp" />
    <title>КРОНА — расписания cron без пересечений</title>
    <script>
      // Тема ставится до первой отрисовки, иначе тёмная тема мигнёт светлой.
      try {
        const saved = JSON.parse(localStorage.getItem('krona.theme') ?? 'null');
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
