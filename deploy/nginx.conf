server {
    listen 8080;
    root /usr/share/nginx/html;

    # Имена файлов сборки содержат хеш — их можно кэшировать навсегда.
    location /bundle/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /art/ {
        expires 7d;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; font-src 'self'";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer;
    }

    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
