# Один и тот же отчёт в трёх регионах. Каждый CronJob считает 09:00 по своему поясу,
# а читает общее хранилище, которое выдерживает только одну тяжёлую выгрузку за раз
# (порог 1). Поэтому важно, когда 09:00 наступает по UTC.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report-moscow
  annotations:
    krona/duration: 45m
spec:
  schedule: "0 9 * * 1-5"
  timeZone: Europe/Moscow
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: report
              image: registry.local/analytics/report:3.2.0
